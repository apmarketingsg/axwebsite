<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title"><title id="title">TCP, UDP and reliability</title><rect width="1000" height="390" rx="24" fill="#faf8f5"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17212b">TCP, UDP and reliability</text><rect x="40" y="88" width="300" height="210" rx="16" fill="white" stroke="#ded7cf"/><text x="60" y="126" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#af571e">TCP</text><text x="60" y="164" font-family="Arial,sans-serif" font-size="19" fill="#374151">Ordered byte stream</text><text x="60" y="193" font-family="Arial,sans-serif" font-size="19" fill="#374151">Acknowledgements</text><text x="60" y="222" font-family="Arial,sans-serif" font-size="19" fill="#374151">Loss recovery + controls</text><rect x="360" y="88" width="300" height="210" rx="16" fill="white" stroke="#ded7cf"/><text x="380" y="126" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#af571e">UDP</text><text x="380" y="164" font-family="Arial,sans-serif" font-size="19" fill="#374151">Independent datagrams</text><text x="380" y="193" font-family="Arial,sans-serif" font-size="19" fill="#374151">No built-in ordering</text><text x="380" y="222" font-family="Arial,sans-serif" font-size="19" fill="#374151">Application handles recovery</text><rect x="680" y="88" width="300" height="210" rx="16" fill="white" stroke="#ded7cf"/><text x="700" y="126" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#af571e">QUIC over UDP</text><text x="700" y="164" font-family="Arial,sans-serif" font-size="19" fill="#374151">Reliable streams</text><text x="700" y="193" font-family="Arial,sans-serif" font-size="19" fill="#374151">Congestion control</text><text x="700" y="222" font-family="Arial,sans-serif" font-size="19" fill="#374151">Used by HTTP/3</text><text x="40" y="345" font-family="Arial,sans-serif" font-size="18" fill="#374151">None guarantees success through every outage. Select the complete application protocol stack.</text></svg>