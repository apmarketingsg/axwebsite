<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title"><title id="title">VXLAN extends logical segments over an IP underlay</title><rect width="1000" height="390" rx="24" fill="#faf8f5"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17212b">VXLAN extends logical segments over an IP underlay</text><rect x="40" y="88" width="300" height="210" rx="16" fill="white" stroke="#ded7cf"/><text x="60" y="126" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#af571e">VTEP at site A</text><text x="60" y="164" font-family="Arial,sans-serif" font-size="19" fill="#374151">Ethernet frame in VNI 1001</text><text x="60" y="193" font-family="Arial,sans-serif" font-size="19" fill="#374151">Encapsulate in VXLAN</text><text x="60" y="222" font-family="Arial,sans-serif" font-size="19" fill="#374151">UDP + IP transport</text><rect x="360" y="88" width="300" height="210" rx="16" fill="white" stroke="#ded7cf"/><text x="380" y="126" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#af571e">IP underlay</text><text x="380" y="164" font-family="Arial,sans-serif" font-size="19" fill="#374151">Routes outer IP packet</text><text x="380" y="193" font-family="Arial,sans-serif" font-size="19" fill="#374151">MTU must fit encapsulation</text><text x="380" y="222" font-family="Arial,sans-serif" font-size="19" fill="#374151">VXLAN does not encrypt</text><rect x="680" y="88" width="300" height="210" rx="16" fill="white" stroke="#ded7cf"/><text x="700" y="126" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#af571e">VTEP at site B</text><text x="700" y="164" font-family="Arial,sans-serif" font-size="19" fill="#374151">Decapsulate VNI 1001</text><text x="700" y="193" font-family="Arial,sans-serif" font-size="19" fill="#374151">Deliver to mapped segment</text><text x="700" y="222" font-family="Arial,sans-serif" font-size="19" fill="#374151">Different VNIs need routing</text><text x="40" y="345" font-family="Arial,sans-serif" font-size="18" fill="#374151">Illustrative same-segment path. Actual design, access controls and scale depend on configuration.</text></svg>