<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">400G capacity starts with usable spectrum</title><rect width="900" height="440" rx="20" fill="white"/><g font-family="Arial,sans-serif" fill="#18212b"><text x="32" y="52" font-size="27" font-weight="700">400G capacity starts with usable spectrum</text><rect x="32" y="96" width="836" height="88" rx="14" fill="#fff6ea" stroke="#dfd9d2"/><text x="54" y="126" font-size="21" font-weight="700">50 GHz fixed-grid path</text><text x="54" y="153" font-size="18">Not a drop-in path for conventional 400ZR/ZR+ at 400G.</text><text x="54" y="175" font-size="16" fill="#555">Filter passbands matter—not just the distance between channel centres.</text><rect x="32" y="202" width="836" height="88" rx="14" fill="#f4f6f8" stroke="#dfd9d2"/><text x="54" y="232" font-size="21" font-weight="700">75 GHz or wider compatible channels</text><text x="54" y="259" font-size="18">Check optics, filters, power budget, OSNR and the full route.</text><text x="54" y="281" font-size="16" fill="#555">A suitable channel width is necessary, but not sufficient.</text><rect x="32" y="308" width="836" height="88" rx="14" fill="#fff6ea" stroke="#dfd9d2"/><text x="54" y="338" font-size="21" font-weight="700">Illustrative 4.8 THz planning window</text><text x="54" y="365" font-size="18">75 GHz: 64 × 400G = 25.6 Tbps; 100 GHz: 48 × 400G = 19.2 Tbps.</text><text x="54" y="387" font-size="16" fill="#555">Idealised nominal capacity per direction, before practical exclusions.</text></g></svg>