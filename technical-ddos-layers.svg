<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title"><title id="title">DDoS protection: define each layer</title><rect width="900" height="440" rx="20" fill="white"/><g font-family="Arial,sans-serif" fill="#18212b"><text x="32" y="52" font-size="27" font-weight="700">DDoS protection: define each layer</text><rect x="32" y="96" width="836" height="88" rx="14" fill="#fff6ea" stroke="#dfd9d2"/><text x="54" y="126" font-size="21" font-weight="700">Network protection</text><text x="54" y="153" font-size="18">Protect the agreed public IP prefixes against network-layer attacks.</text><text x="54" y="175" font-size="16" fill="#555">Axclusive offers opt-in Always-On Magic Transit for DIA.</text><rect x="32" y="202" width="836" height="88" rx="14" fill="#f4f6f8" stroke="#dfd9d2"/><text x="54" y="232" font-size="21" font-weight="700">Traffic delivery</text><text x="54" y="259" font-size="18">Confirm routing, tunnels, clean-traffic capacity and resilience.</text><text x="54" y="281" font-size="16" fill="#555">GRE is encapsulation; encryption requires an appropriate mechanism.</text><rect x="32" y="308" width="836" height="88" rx="14" fill="#fff6ea" stroke="#dfd9d2"/><text x="54" y="338" font-size="21" font-weight="700">Applications and operations</text><text x="54" y="365" font-size="18">Scope WAF / application controls and incident responsibilities.</text><text x="54" y="387" font-size="16" fill="#555">They are not automatically included with network-layer protection.</text></g></svg>