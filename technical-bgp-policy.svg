<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title"><title id="title">BGP selects routes according to policy</title><rect width="1000" height="390" rx="24" fill="#faf8f5"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17212b">BGP selects routes according to policy</text><rect x="40" y="88" width="300" height="210" rx="16" fill="white" stroke="#ded7cf"/><text x="60" y="126" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#af571e">Exchange</text><text x="60" y="164" font-family="Arial,sans-serif" font-size="19" fill="#374151">Prefixes and attributes</text><text x="60" y="193" font-family="Arial,sans-serif" font-size="19" fill="#374151">Between configured peers</text><text x="60" y="222" font-family="Arial,sans-serif" font-size="19" fill="#374151">TCP port 179</text><rect x="360" y="88" width="300" height="210" rx="16" fill="white" stroke="#ded7cf"/><text x="380" y="126" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#af571e">Select</text><text x="380" y="164" font-family="Arial,sans-serif" font-size="19" fill="#374151">Local policy comes first</text><text x="380" y="193" font-family="Arial,sans-serif" font-size="19" fill="#374151">AS path is one attribute</text><text x="380" y="222" font-family="Arial,sans-serif" font-size="19" fill="#374151">Not a latency measurement</text><rect x="680" y="88" width="300" height="210" rx="16" fill="white" stroke="#ded7cf"/><text x="700" y="126" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#af571e">Forward</text><text x="700" y="164" font-family="Arial,sans-serif" font-size="19" fill="#374151">Install eligible next hop</text><text x="700" y="193" font-family="Arial,sans-serif" font-size="19" fill="#374151">Monitor real performance</text><text x="700" y="222" font-family="Arial,sans-serif" font-size="19" fill="#374151">Filter and validate routes</text><text x="40" y="345" font-family="Arial,sans-serif" font-size="18" fill="#374151">TCP authentication and RPKI origin validation have different roles; neither encrypts BGP payloads.</text></svg>